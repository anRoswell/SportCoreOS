<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Emerald Pitch Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Cyan Circuit Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Base with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Border with Glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.5" filter="url(#borderGlow)" />

  <!-- Geodesic / Hexagonal Soccer Net Cage -->
  <g stroke="url(#cyanGrad)" stroke-width="3.5" fill="none" opacity="0.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Hexagon Outer -->
    <polygon points="256,64 420,158 420,354 256,448 92,354 92,158" />
    
    <!-- Geodesic Triangulation Lines -->
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="6,6" opacity="0.4" />
    <line x1="92" y1="158" x2="420" y2="354" opacity="0.3" />
    <line x1="92" y1="354" x2="420" y2="158" opacity="0.3" />
    
    <polygon points="256,130 360,190 360,322 256,382 152,322 152,190" stroke-width="2" opacity="0.5" />
    
    <!-- Connecting Vertices -->
    <line x1="256" y1="64" x2="256" y2="130" />
    <line x1="420" y1="158" x2="360" y2="190" />
    <line x1="420" y1="354" x2="360" y2="322" />
    <line x1="256" y1="448" x2="256" y2="382" />
    <line x1="92" y1="354" x2="152" y2="322" />
    <line x1="92" y1="158" x2="152" y2="190" />
  </g>

  <!-- Kinetic Soccer Athlete 'S' Shape with High Neon Glow -->
  <g filter="url(#neonGlow)">
    <!-- Athlete Head -->
    <circle cx="330" cy="168" r="26" fill="url(#emeraldGrad)" />
    <circle cx="330" cy="168" r="28" fill="none" stroke="#6ee7b7" stroke-width="3" opacity="0.8" />

    <!-- Kinetic Speed Streaks behind the S -->
    <line x1="130" y1="270" x2="220" y2="270" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <line x1="150" y1="290" x2="200" y2="290" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="140" y1="250" x2="190" y2="250" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Kinetic Running Arm (Right) -->
    <path d="M 320 200 Q 365 200 375 230" fill="none" stroke="url(#emeraldGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Kinetic Running S Body / Torso & Leg Silhouette -->
    <path d="M 315 205 
             C 270 185, 215 195, 205 240 
             C 195 285, 260 300, 290 325 
             C 335 360, 310 405, 245 400 
             C 205 395, 175 365, 170 345
             L 155 360
             C 170 395, 210 425, 260 422
             C 340 420, 365 350, 320 305
             C 285 270, 220 260, 230 230
             C 240 205, 275 200, 305 215 Z" 
          fill="url(#emeraldGrad)" />

    <!-- Kinetic Running Leg (Front / Left) -->
    <path d="M 230 330 L 165 425 L 140 420" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkling Core Pulse Star -->
  <circle cx="270" cy="265" r="5" fill="#ffffff" filter="url(#borderGlow)" />
</svg>

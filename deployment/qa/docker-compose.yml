version: "3.8"

services:
  # NOTA: La base de datos QA ahora está centralizada en la VPS (puerto 52132, sportcoreos_db_qa).
  # El servicio postgres-qa local se deja comentado para evitar duplicidad de datos y ahorrar recursos.
  # postgres-qa:
  #   image: postgres:16-alpine
  #   container_name: sportcoreos_qa_db
  #   restart: always
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-sportcore_user_qa}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_NAME:-sportcoreos_db_qa}
  #   ports:
  #     - "${HOST_DB_PORT:-55132}:5432"
  #   volumes:
  #     - sportcoreos_qa_postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - sportcoreos_qa_net

  backend:
    image: ${API_IMAGE:-ghcr.io/anroswell/sportcoreos-api:qa-latest}
    build:
      context: ../../SportCoreOS-api
      dockerfile: Dockerfile
    container_name: sportcoreos_api_qa
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - sportcoreos_qa_uploads:/usr/src/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sportcoreos_qa_net

  frontend:
    image: ${WEB_IMAGE:-ghcr.io/anroswell/sportcoreos-web:qa-latest}
    build:
      context: ../../SportCoreOS-web
      dockerfile: Dockerfile
      args:
        CONFIGURATION: qa
    container_name: sportcoreos_web_qa
    restart: always
    ports:
      - "4202:80"
    depends_on:
      - backend
    networks:
      - sportcoreos_qa_net

volumes:
  sportcoreos_qa_uploads:

networks:
  sportcoreos_qa_net:
    driver: bridge


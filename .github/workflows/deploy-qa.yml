name: SportCoreOS — Deploy QA (GHCR & VPS)

on:
  push:
    branches:
      - dev
      - develop
      - qa
      - feature/crud-canchas-tienda-enhancements
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: '¿Desplegar remotamente al VPS de QA después de construir imágenes?'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/sportcoreos-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/sportcoreos-web

jobs:
  # ============================================================================
  # 1. CONSTRUCCIÓN Y PUBLICACIÓN DE IMÁGENES DOCKER EN GHCR (QA)
  # ============================================================================
  build-and-push-qa:
    name: Build & Push Docker Images (QA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND API DOCKER IMAGE ---
      - name: Extract Metadata for API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sportcoreos-api
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-

      - name: Build and Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./SportCoreOS-api
          file: ./SportCoreOS-api/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND WEB DOCKER IMAGE ---
      - name: Extract Metadata for Web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sportcoreos-web
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-

      - name: Build and Push Frontend Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./SportCoreOS-web
          file: ./SportCoreOS-web/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. DESPLIEGUE REMOTO A SERVIDOR / VPS (QA)
  # ============================================================================
  deploy-qa:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push-qa
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_vps == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH (Solo si VPS_HOST está configurado)
        if: ${{ env.HAS_VPS_SECRET == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          HAS_VPS_SECRET: ${{ secrets.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "🚀 Iniciando despliegue de SportCoreOS QA..."
            mkdir -p ~/sportcoreos-qa
            cd ~/sportcoreos-qa

            # Autenticación contra GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descarga de imágenes y despliegue con Docker Compose
            docker compose pull backend frontend
            docker compose up -d --remove-orphans backend frontend
            docker image prune -f
            echo "✅ Despliegue de SportCoreOS QA completado exitosamente."

      - name: Notificar si VPS no tiene secretos configurados
        if: ${{ secrets.VPS_HOST == '' }}
        run: |
          echo "ℹ️ Las imágenes Docker fueron construidas y publicadas en GHCR con éxito."
          echo "ℹ️ El paso de despliegue remoto por SSH se omitió porque el secreto 'VPS_HOST' aún no ha sido configurado en el repositorio."

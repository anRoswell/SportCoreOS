name: SportCoreOS — Deploy Production (GHCR & VPS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: '¿Desplegar remotamente al VPS de Producción?'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # 1. CONSTRUCCIÓN Y PUBLICACIÓN DE IMÁGENES DOCKER EN GHCR (PRODUCCIÓN)
  # ============================================================================
  build-and-push-prod:
    name: Build & Push Docker Images (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND API DOCKER IMAGE (PROD) ---
      - name: Extract Metadata for API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sportcoreos-api
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=prod-

      - name: Build and Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./SportCoreOS-api
          file: ./SportCoreOS-api/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND WEB DOCKER IMAGE (PROD) ---
      - name: Extract Metadata for Web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sportcoreos-web
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=prod-

      - name: Build and Push Frontend Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./SportCoreOS-web
          file: ./SportCoreOS-web/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. DESPLIEGUE REMOTO A SERVIDOR / VPS (PRODUCCIÓN)
  # ============================================================================
  deploy-prod:
    name: Deploy to Production Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push-prod
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_vps == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Production VPS Configuration Secrets
        id: check_prod_vps
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "has_vps=true" >> $GITHUB_OUTPUT
          else
            echo "has_vps=false" >> $GITHUB_OUTPUT
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_PROD_HOST || secrets.VPS_HOST }}

      - name: Deploy to VPS via SSH
        if: steps.check_prod_vps.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_PROD_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_PROD_USER || secrets.VPS_USER }}
          key: ${{ secrets.VPS_PROD_SSH_KEY || secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PROD_PASSPHRASE || secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PROD_PORT || secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "🚀 Iniciando despliegue de SportCoreOS Producción..."
            mkdir -p ~/sportcoreos-prod
            cd ~/sportcoreos-prod

            # Autenticación contra GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descarga de imágenes y despliegue con Docker Compose
            docker compose pull backend frontend
            docker compose up -d --remove-orphans backend frontend
            docker image prune -f
            echo "✅ Despliegue de SportCoreOS Producción completado exitosamente."

      - name: Notificar si VPS de Producción no tiene secretos configurados
        if: steps.check_prod_vps.outputs.has_vps != 'true'
        run: |
          echo "ℹ️ Las imágenes Docker de Producción fueron construidas y publicadas en GHCR con éxito."
          echo "ℹ️ El paso de despliegue remoto por SSH se omitió porque el secreto 'VPS_PROD_HOST' aún no ha sido configurado en el repositorio."

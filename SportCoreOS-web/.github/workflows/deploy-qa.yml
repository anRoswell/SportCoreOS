name: SportCoreOS Web — Deploy QA

on:
  push:
    branches:
      - dev
      - develop
      - qa
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: '¿Desplegar al VPS?'
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anroswell/sportcoreos-web

jobs:
  build-and-push:
    name: Build & Push Web Image (QA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Deploy Web to VPS (QA)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_vps == 'true' }}

    steps:
      - name: Check VPS Secrets
        id: check_vps
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "has_vps=true" >> $GITHUB_OUTPUT
          else
            echo "has_vps=false" >> $GITHUB_OUTPUT
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy via SSH
        if: steps.check_vps.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Actualizando SportCoreOS Web en QA..."
            cd ~/sportcoreos-qa || cd ~/SportCoreOS/sportcoreos-qa
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull frontend
            docker compose up -d --remove-orphans frontend
            docker image prune -f
            docker ps --filter "name=sportcoreos"
            echo "✅ Frontend Web actualizado en QA."

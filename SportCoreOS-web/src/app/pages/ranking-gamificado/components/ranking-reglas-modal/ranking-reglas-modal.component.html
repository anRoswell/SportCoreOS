<div class="modal-backdrop" (click)="close.emit()">
  <div class="rules-modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="title-with-icon">
        <i class="fa-solid fa-gamepad text-emerald"></i>
        <div>
          <h3>Sistema de Gamificación & Economía de XP</h3>
          <p>Reglas oficiales para subir de nivel y evolucionar cartas de alumnos</p>
        </div>
      </div>
      <button class="btn-close" (click)="close.emit()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="rules-grid">
        @for (regla of reglas; track regla.id) {
          <div class="rule-box" [class.gain]="regla.tipo === 'gain'" [class.penalty]="regla.tipo === 'penalty'">
            <div class="rule-icon"><i [class]="regla.icono"></i></div>
            <div class="rule-info">
              <h4>{{ regla.titulo }}</h4>
              <p>{{ regla.descripcion }}</p>
              <span class="rule-xp-badge" [class.penalty-badge]="regla.tipo === 'penalty'">{{ regla.xpBadge }}</span>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-primary" (click)="close.emit()">Entendido</button>
    </div>
  </div>
</div>

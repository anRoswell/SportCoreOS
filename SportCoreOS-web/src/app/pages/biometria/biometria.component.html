<div class="biometria-page">
  <!-- HEADER DE LA PÁGINA -->
  <div class="page-header">
    <div class="header-titles">
      <div class="header-badge">
        <i class="fa-solid fa-heart-pulse"></i>
        <span>MÓDULO DE RENDIMIENTO & FISIOLOGÍA</span>
      </div>
      <h1 class="page-title">Biometría Deportiva & Test Físicos</h1>
      <p class="page-subtitle">
        Control antropométrico periódico, test de Cooper, velocidad anaeróbica y radar de aptitud atlética.
      </p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="openCreateModal()">
        <i class="fa-solid fa-plus"></i>
        <span>Nueva Medición Antropométrica</span>
      </button>
    </div>
  </div>

  <!-- TARJETAS DE KPIs RÁPIDOS -->
  <app-biometria-kpi-bar
    [totalEvaluaciones]="totalEvaluaciones()"
    [atletasMonitoreados]="atletasMonitoreadosCount()"
    [promedioImc]="promedioImc()"
    [sobresalientesCount]="sobresalientesCount()"
  ></app-biometria-kpi-bar>

  <!-- BARRA DE FILTROS REACTIVOS & BÚSQUEDA -->
  <app-biometria-filters
    [searchQuery]="searchQuery()"
    [selectedCategoriaId]="selectedCategoriaId()"
    [selectedDiagnostico]="selectedDiagnostico()"
    [sortBy]="sortBy()"
    [totalRecords]="totalRecords()"
    [categorias]="categorias()"
    [hasActiveFilters]="hasActiveFilters()"
    [categoryCounts]="categoryCounts()"
    (searchChange)="onSearchChange($event)"
    (categoriaChange)="selectCategoria($event)"
    (diagnosticoChange)="onDiagnosticoChange($event)"
    (sortChange)="onSortChange($event)"
    (resetFilters)="resetAllFilters()"
  ></app-biometria-filters>

  <!-- TABLA DE EVALUACIONES CON LAZY LOADING & PAGINACIÓN -->
  <app-biometria-table
    [mediciones]="mediciones()"
    [loading]="loading()"
    [hasActiveFilters]="hasActiveFilters()"
    [totalRecords]="totalRecords()"
    [totalPages]="totalPages()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [showingStart]="showingStart()"
    [showingEnd]="showingEnd()"
    (viewDetail)="openDetailModal($event)"
    (createNew)="openCreateModal()"
    (resetFilters)="resetAllFilters()"
    (pageChange)="setPage($event)"
    (pageSizeChange)="setPageSize($event)"
  ></app-biometria-table>

  <!-- MODAL DETALLE / RADAR BIOMÉTRICO -->
  @if (showDetailModal() && selectedMedicion()) {
    <app-biometria-detail-modal
      [medicion]="selectedMedicion()!"
      (close)="closeDetailModal()"
    ></app-biometria-detail-modal>
  }

  <!-- MODAL NUEVA MEDICIÓN -->
  @if (showCreateModal()) {
    <app-biometria-form-modal
      [jugadores]="jugadores()"
      [saving]="saving()"
      (close)="closeCreateModal()"
      (save)="submitCreateBio($event)"
    ></app-biometria-form-modal>
  }

  <!-- TOAST -->
  @if (toastMessage()) {
    <div class="toast-floating-alert">
      <i class="fa-solid fa-circle-check"></i>
      <span>{{ toastMessage() }}</span>
    </div>
  }
</div>

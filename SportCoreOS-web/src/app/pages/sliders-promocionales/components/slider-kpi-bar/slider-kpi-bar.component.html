<section class="kpi-grid">
  <div class="kpi-card">
    <div class="kpi-icon-box bg-emerald-soft text-emerald">
      <i class="fa-solid fa-layer-group"></i>
    </div>
    <div class="kpi-content">
      <span class="kpi-label">Total Sliders</span>
      <h3 class="kpi-value">{{ totalSliders }}</h3>
      <span class="kpi-sub">Diapositivas registradas</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon-box bg-cyan-soft text-cyan">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="kpi-content">
      <span class="kpi-label">Activos en Vivo</span>
      <h3 class="kpi-value text-emerald">{{ activeSlidersCount }}</h3>
      <span class="kpi-sub">Visibles en el Onboarding</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon-box bg-purple-soft text-purple">
      <i class="fa-solid fa-mobile-screen"></i>
    </div>
    <div class="kpi-content">
      <span class="kpi-label">Destino Móvil</span>
      <h3 class="kpi-value">{{ mobileSlidersCount }}</h3>
      <span class="kpi-sub">App Deportista & Familias</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon-box bg-amber-soft text-amber">
      <i class="fa-solid fa-eye-slash"></i>
    </div>
    <div class="kpi-content">
      <span class="kpi-label">Borradores / Inactivos</span>
      <h3 class="kpi-value text-muted">{{ inactiveSlidersCount }}</h3>
      <span class="kpi-sub">Pausados o en revisión</span>
    </div>
  </div>
</section>
